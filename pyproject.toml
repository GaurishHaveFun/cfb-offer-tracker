[project]
name = "cfb-offers"
version = "0.1.0"
description = "Scrapes X/Twitter for CFB offer/commit/decommit tweets and logs them to a Google Sheet."
requires-python = ">=3.11"
dependencies = [
    "twscrape==0.20.1",
    "gspread>=6.0",
    "google-auth>=2.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
