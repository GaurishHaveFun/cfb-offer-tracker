name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Must stay on GitHub-hosted runners: this workflow runs on pull
    # requests, and pull requests from anyone must never run on the
    # self-hosted Mac (see docs/self-hosted-runner.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      # The scrape workflow uses a regular `pip install .` (package lands in
      # site-packages, not the checkout), which unit tests under an editable
      # install can't catch - e.g. config/schools.yaml not being found.
      - name: Smoke-test a regular install, like the scrape workflow
        run: |
          python -m venv /tmp/plain
          /tmp/plain/bin/pip install -q .
          /tmp/plain/bin/python -c "from cfb_offers.config import load_schools; from cfb_offers.queries import build_all_queries; s = load_schools(); print(len(s), 'schools,', len(build_all_queries(s, 3)), 'searches')"
