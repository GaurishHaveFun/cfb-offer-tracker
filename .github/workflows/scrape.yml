name: Scrape CFB offers

# Runs on a self-hosted runner on a Mac at home, not on GitHub's servers: X
# answers searches from GitHub's data-center IPs with 403, but not from a
# home connection. See docs/self-hosted-runner.md.
#
# This repo is public, so the self-hosted runner must only ever run this
# workflow, and this workflow must only ever run on `schedule` and
# `workflow_dispatch` (both limited to the repo's own branches and people
# with write access). Never add pull_request/push triggers here, and never
# point tests.yml (which runs on pull requests) at the self-hosted runner.
on:
  schedule:
    # 04:17/10:17/16:17/22:17 UTC = 00:17/06:17/12:17/18:17 US Eastern
    # (daylight time), the same slots the old launchd job used.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Override the lookback window in days (leave blank to start from the newest tweet in the sheet)"
        required: false
        type: string
      max_pages:
        description: "Override the pages-per-query cap (leave blank for the default)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cfb-offers-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # The custom "cfb-scraper" label is only on the home Mac's runner, so
    # this job can't land anywhere else. (Any job asking for "self-hosted"
    # could land on the Mac, which is why pull-request workflows from
    # outside contributors need approval - see docs/self-hosted-runner.md.)
    runs-on: [self-hosted, macOS, cfb-scraper]
    # Jobs wait in the queue while the Mac is asleep and run when it wakes
    # (GitHub drops a queued job after 24h). No 30-minute clamp here: on a
    # self-hosted runner the scraper widens its window to cover any gap.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Verify required secrets are set
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          missing=()
          [ -z "${X_COOKIES}" ] && missing+=("X_COOKIES")
          [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ] && missing+=("GOOGLE_SERVICE_ACCOUNT_JSON")
          [ -z "${SHEET_ID}" ] && missing+=("SHEET_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}. Set them with 'gh secret set <NAME>' - see docs/github-actions-setup.md."
            exit 1
          fi

      - name: Mask derived secret values
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # SHEET_ID and the service account's client_email aren't registered
          # as GitHub secrets themselves, but they're derived from secrets
          # and could otherwise leak into error text/tracebacks - mask them
          # explicitly.
          echo "::add-mask::${SHEET_ID}"
          client_email=$(python3 -c "
          import json, os
          try:
              print(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']).get('client_email', ''))
          except Exception:
              pass
          ")
          if [ -n "${client_email}" ]; then
            echo "::add-mask::${client_email}"
          fi

      - name: Install package
        run: pip install .

      # No tweet text or player info is ever logged here - counts only
      # (this repo is public). See src/cfb_offers/main.py, which prints
      # only "appended=/updated=" and "tweets_seen=/.../events=" lines.
      - name: Run scraper
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SINCE_DAYS: ${{ inputs.since_days }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -o pipefail
          args=()
          if [ -n "${SINCE_DAYS}" ]; then args+=(--since-days "${SINCE_DAYS}"); fi
          if [ -n "${MAX_PAGES}" ]; then args+=(--max-pages "${MAX_PAGES}"); fi
          # main.py's counts-only lines go to stdout (appended=/updated=)
          # and stderr (tweets_seen=.../events=) - capture both, in order,
          # for the job summary step below, without changing main.py.
          # Raw tweets are kept on the Mac (never uploaded as an artifact -
          # this repo is public) for --prune-sheet, for 60 days, as the old
          # launchd job did.
          runs_dir="${HOME}/cfb-offer-tracker-data/runs"
          mkdir -p "${runs_dir}"
          if [ -z "${MAX_PAGES}" ]; then args+=(--max-pages 5); fi
          args+=(--dump-raw "${runs_dir}/$(date +%Y%m%d-%H%M).jsonl")
          python -m cfb_offers "${args[@]}" 2>&1 | tee scrape_output.txt
          find "${runs_dir}" -name '*.jsonl' -mtime +60 -delete

      - name: Write job summary (counts only)
        if: always()
        run: |
          {
            echo "### CFB offer scrape"
            echo
            echo '```'
            if [ -f scrape_output.txt ]; then
              grep -E '^(appended=|tweets_seen=|since_days=.*clamped)' scrape_output.txt || echo "no counts line found in scraper output"
            else
              echo "scraper did not produce output (see job logs)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f scrape_output.txt
