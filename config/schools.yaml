    context_aliases: ["Tigers"]
    coach_handles: []
  - name: Ole Miss
    aliases: ["Ole Miss", "University of Mississippi", "#HottyToddy", "@OleMissFB", "@OleMiss"]
    handles: ["OleMissFB"]  # verify
    context_aliases: ["Rebels"]
    coach_handles: []
  - name: South Carolina
    aliases: ["South Carolina", "Gamecocks", "#ForeverToThee", "@GamecockFB", "@UofSC"]
