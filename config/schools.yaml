    handles: ["UKFootball"]  # verify
    context_aliases: ["Wildcats"]
    coach_handles: []
  - name: Mississippi State
    aliases: ["Mississippi State", "Miss State", "#HailState", "@HailStateFB", "@msstate"]
    handles: ["HailStateFB"]  # verify
    context_aliases: ["Bulldogs"]
    coach_handles: []
  - name: Missouri
    aliases: ["Missouri", "Mizzou", "#MIZ", "@MizzouFootball", "@Mizzou"]
